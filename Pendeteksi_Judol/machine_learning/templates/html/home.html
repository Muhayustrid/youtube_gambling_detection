<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deteksi Komentar Judol</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }
    button:hover {
      background: #45a049;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #f9fafb;
      border: 1px solid #ddd;
    }
    .result p {
      margin: 8px 0;
    }
    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: bold;
    }
    .badge.judol {
      background: #ff4d4f;
      color: white;
    }
    .badge.bukan {
      background: #4caf50;
      color: white;
    }
    .proba {
      font-weight: bold;
      color: #0077cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚨 Detektor Komentar Judol</h1>
    <form method="POST">
      {% csrf_token %}
      <textarea name="comment" rows="4" placeholder="Masukkan komentar di sini..."></textarea><br>
      <button type="submit">🔍 Deteksi</button>
    </form>

    {% if text %}
    <div class="result">
      <p><b>Input:</b> {{ text }}</p>
      <p><b>Clean:</b> {{ clean }}</p>
      <p>
        <b>Prediksi:</b> 
        {% if proba >= 0.50 %}
          <span class="badge judol">Promosi Judol</span>
        {% else %}
          <span class="badge bukan">Bukan Judol</span>
        {% endif %}
      </p>
      <p><b>Probabilitas:</b> <span class="proba">{{ proba|floatformat:2 }}%</span></p>
    </div>
    {% endif %}
  </div>
</body>
</html>
