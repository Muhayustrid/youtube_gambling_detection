<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Judol Comment Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle" />
  <style>
    .table td {
      vertical-align: top;
    }

    .judol {
      background: #fff5f5;
    }

    .non {
      background: #f6ffed;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .95rem;
    }

    footer {
      margin-top: 3rem;
    }

    .navbar-brand {
      font-weight: bold;
    }

    .profile-img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
    }
  </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

  <!-- navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Judol Detector</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav me-auto">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
            href="{% url 'home' %}">Home</a>
          <a class="nav-link {% if request.resolver_match.url_name == 'analyze' %}active{% endif %}"
            href="{% url 'analyze' %}">Analisis Komentar</a>
        </div>
        <!-- kanan: profile / login -->
        <div class="d-flex align-items-center">
          <a href="#">
            <span class="material-symbols-outlined">
              account_circle
            </span>
          </a>
        </div>
      </div>
    </div>
  </nav>
  <!-- end_navbar -->

  <!-- konten -->
  <main class="flex-fill">
    {% block content %}
    {% endblock %}
  </main>
  <!-- end_konten -->

  <!-- footer -->
  <footer class="bg-light text-muted py-3 mt-auto border-top">
    <div class="container text-center">
      <small>&copy; 2025 Judol Comment Detector</small>
    </div>
  </footer>
  <!--end_footer -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
